name: CI

on: [push, pull_request]

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-14, windows-2022]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2.1
      env:
        CIBW_BUILD: 'cp310-*'
        CIBW_SKIP: '*musllinux* *_i686 *-win32'

    - run: ls -lh wheelhouse
      shell: bash

    - uses: actions/upload-artifact@v7
      with:
        name: wheels2-${{ matrix.os }}
        path: wheelhouse/*.whl

  merge:
    runs-on: ubuntu-latest
    needs: build_wheels
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: wheels2
          pattern: wheels2-*
          delete-merged: true

  standard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15-intel, macos-14, macos-15, windows-latest]
        py: ['3.10', '3.11', '3.12', '3.13', '3.14']
    name: ${{ matrix.os }} py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    needs: merge
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: checkout monomers
      uses: actions/checkout@v7
      with:
        repository: MonomerLibrary/monomers
        path: monomers

    - uses: actions/download-artifact@v7
      with:
        name: wheels2
        path: wheels2
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.py }}
    - name: Python Setup
      run: python -m pip install --find-links=wheels2 servalcat
      # add gemmi here to test with gemmi build
    - name: Python Tests
      continue-on-error: true
      env:
        CLIBD_MON: ${{runner.workspace}}/servalcat/monomers
      run: |
        cd tests/
        python3 -m unittest discover -v -s .
        cd ..
